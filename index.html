<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Моя AR-модель</title>
  <!-- Подключаем A-Frame -->
  <script src="aframe.min.js"></script>
  <!-- Подключаем AR.js с поддержкой маркеров -->
  <script src="aframe-ar.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
    <!-- Маркер Hiro -->
    <a-marker preset="hiro">
      <!-- Твоя 3D-модель -->
      <a-entity gltf-model="url(Wall_with_name.glb)" position="0 0 6" scale="1 1 1" rotation="0 180 0"></a-entity>
    </a-marker>
    <!-- Камера -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
